services:
  db:
    image: postgres:15-alpine
    container_name: the_eye_db
    environment:
      POSTGRES_USER: eye_user
      POSTGRES_PASSWORD: eye_password
      POSTGRES_DB: the_eye
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eye_user -d the_eye"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: the_eye_api
    environment:
      - DATABASE_URL=postgresql://eye_user:eye_password@db:5432/the_eye
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: the_eye_frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
